name: Validate Bubbles Pet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --require-hashes --requirement requirements.txt
      - name: Run tests
        run: python -m unittest discover --start-directory tests --verbose
      - name: Verify committed runtime
        run: python scripts/verify_bubbles_pet.py bubbles qa/validation.json
      - name: Check committed QA evidence
        run: python scripts/check_qa_evidence.py
      - name: Rebuild in isolation
        run: |
          python scripts/build_bubbles_pet.py \
            --out-dir build/repro/bubbles \
            --preview-dir build/repro/preview
      - name: Verify rebuilt runtime
        run: python scripts/verify_bubbles_pet.py build/repro/bubbles
      - name: Compare all rebuilt artifacts
        run: python scripts/check_reproducibility.py bubbles preview build/repro/bubbles build/repro/preview
      - name: Upload QA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bubbles-pet-qa
          path: |
            qa/validation.json
            build/repro/bubbles/
            build/repro/preview/
          if-no-files-found: error
          retention-days: 14
